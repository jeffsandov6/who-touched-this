name: Contribution boundary

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-metadata:
    name: Trusted contribution boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target is privileged. Check out only the trusted base-repository code
      # never check out or execute the pull request head in this workflow.
      # Do not pin this checkout to pull_request.base.sha.
      # Security-policy code should come from the current trusted default branch.
      - name: Check out trusted base policy
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Classify trusted pull request metadata
        id: pull-request
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/validate-pull-request-mode.mjs --github-event "$GITHUB_EVENT_PATH"

      - name: Validate community contribution metadata
        if: steps.pull-request.outputs.mode == 'contribution'
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/validate-contribution.mjs --github-event "$GITHUB_EVENT_PATH"

      - name: Create trusted review handoff
        if: steps.pull-request.outputs.mode == 'contribution'
        run: >-
          node --experimental-strip-types scripts/create-review-handoff.mjs
          --github-event "$GITHUB_EVENT_PATH"
          --output trusted-review-handoff.json

      - name: Upload trusted review handoff
        if: steps.pull-request.outputs.mode == 'contribution'
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trusted-contribution-handoff
          path: trusted-review-handoff.json
          if-no-files-found: error
          retention-days: 1
