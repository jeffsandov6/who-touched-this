name: Contribution boundary

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-metadata:
    name: Trusted contribution boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target is privileged. Check out only the trusted base-repository code
      # never check out or execute the pull request head in this workflow.
      - name: Check out trusted base policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate pull request metadata
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/validate-contribution.mjs --github-event "$GITHUB_EVENT_PATH"
