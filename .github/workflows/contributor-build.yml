name: Contributor build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-untrusted-fork:
    name: Untrusted fork build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate contribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run contribution:validate -- --base "$BASE_SHA"

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Run fast platform unit tests
        run: npm run test:contributor
