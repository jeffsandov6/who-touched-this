name: Contributor review

# workflow_run loads this workflow from the trusted default branch. It never uses a workflow file
# from the pull request. The triggering Contribution boundary workflow is metadata-only.
# Do not add a workflow_run branch filter here.
# pull_request_target runs are associated with the contributor branch;
# the upstream boundary already restricts PR base to main.
on:
  workflow_run:
    workflows: [Contribution boundary]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  validate-handoff:
    name: Trusted review handoff
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pull_request_number: ${{ steps.handoff.outputs.pull_request_number }}
      base_repository: ${{ steps.handoff.outputs.base_repository }}
      base_sha: ${{ steps.handoff.outputs.base_sha }}
      head_repository: ${{ steps.handoff.outputs.head_repository }}
      head_sha: ${{ steps.handoff.outputs.head_sha }}
    steps:
      - name: Check out trusted default-branch orchestrator
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Download handoff from the triggering trusted run
        # actions/download-artifact v8.0.0
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: trusted-contribution-handoff
          path: .wtt-ci/handoff
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate handoff and current pull request identity
        id: handoff
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types scripts/verify-review-handoff.mjs
          --handoff .wtt-ci/handoff/trusted-review-handoff.json
          --workflow-event "$GITHUB_EVENT_PATH"

  build-hostile-canvas:
    name: Security review and sandboxed contributor build
    needs: validate-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact trusted base
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          repository: ${{ needs.validate-handoff.outputs.base_repository }}
          ref: ${{ needs.validate-handoff.outputs.base_sha }}
          path: .wtt-ci/trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch only the exact PR canvas tree
        # This sparse checkout materializes only src/canvas. Trusted code checks HEAD and Git modes.
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          repository: ${{ needs.validate-handoff.outputs.base_repository }}
          ref: refs/pull/${{ needs.validate-handoff.outputs.pull_request_number }}/head
          path: .wtt-ci/head-canvas
          fetch-depth: 0
          sparse-checkout: /src/canvas/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Use Node.js 22
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .wtt-ci/trusted/package-lock.json

      - name: Scan contributor canvas using trusted policy
        working-directory: .wtt-ci/head-canvas
        env:
          BASE_SHA: ${{ needs.validate-handoff.outputs.base_sha }}
        run: >-
          node --experimental-strip-types
          ../trusted/scripts/scan-contribution-security.mjs
          --base "$BASE_SHA"
          --report ../artifacts/security-review.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Create workspace from trusted base
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/prepare-pr-review-workspace.mjs create
          --trusted .wtt-ci/trusted
          --output .wtt-ci/proposed-workspace

      - name: Install dependencies from trusted manifests before canvas overlay
        working-directory: .wtt-ci/proposed-workspace
        run: npm ci

      - name: Overlay only validated PR-head canvas blobs
        env:
          HEAD_SHA: ${{ needs.validate-handoff.outputs.head_sha }}
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/prepare-pr-review-workspace.mjs overlay
          --trusted .wtt-ci/trusted
          --workspace .wtt-ci/proposed-workspace
          --head-checkout .wtt-ci/head-canvas
          --head-sha "$HEAD_SHA"

      - name: Run contributor code in a networkless resource-bounded container
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/run-review-sandbox.mjs build
          --workspace .wtt-ci/proposed-workspace

      - name: Sanitize hostile static output before upload
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/prepare-pr-review-workspace.mjs sanitize-artifact
          --source .wtt-ci/proposed-workspace/dist
          --output .wtt-ci/artifacts/proposed-site

      - name: Upload security review report
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-${{ needs.validate-handoff.outputs.pull_request_number }}-security-review
          path: .wtt-ci/artifacts/security-review.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Upload sanitized proposed site
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-${{ needs.validate-handoff.outputs.pull_request_number }}-proposed-site
          path: .wtt-ci/artifacts/proposed-site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  visual-preview:
    name: Sandboxed visual preview
    needs: [validate-handoff, build-hostile-canvas]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact trusted base
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          repository: ${{ needs.validate-handoff.outputs.base_repository }}
          ref: ${{ needs.validate-handoff.outputs.base_sha }}
          path: .wtt-ci/trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download sanitized proposed static output
        # actions/download-artifact v8.0.0
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: pr-${{ needs.validate-handoff.outputs.pull_request_number }}-proposed-site
          path: .wtt-ci/downloaded-proposed

      - name: Use Node.js 22
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .wtt-ci/trusted/package-lock.json

      - name: Install trusted preview runtime dependencies
        working-directory: .wtt-ci/trusted
        run: npm ci --ignore-scripts

      - name: Create isolated BEFORE workspace
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/prepare-pr-review-workspace.mjs create
          --trusted .wtt-ci/trusted
          --output .wtt-ci/base-workspace

      - name: Install BEFORE dependencies from trusted manifests
        working-directory: .wtt-ci/base-workspace
        run: npm ci

      - name: Build BEFORE canvas in a networkless resource-bounded container
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/run-review-sandbox.mjs base-build
          --workspace .wtt-ci/base-workspace

      - name: Sanitize BEFORE static output
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/prepare-pr-review-workspace.mjs sanitize-artifact
          --source .wtt-ci/base-workspace/dist
          --output .wtt-ci/base-dist

      - name: Revalidate downloaded artifact into fresh staging
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/prepare-pr-review-workspace.mjs sanitize-artifact
          --source .wtt-ci/downloaded-proposed
          --output .wtt-ci/validated-proposed

      - name: Prepare trusted review output directory
        run: mkdir -p .wtt-ci/artifacts/pr-review

      - name: Capture BEFORE and PROPOSED AFTER in a networkless browser container
        env:
          BASE_SHA: ${{ needs.validate-handoff.outputs.base_sha }}
          HEAD_SHA: ${{ needs.validate-handoff.outputs.head_sha }}
          PR_NUMBER: ${{ needs.validate-handoff.outputs.pull_request_number }}
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/run-review-sandbox.mjs preview
          --trusted .wtt-ci/trusted
          --base-dist .wtt-ci/base-dist
          --proposed-dist .wtt-ci/validated-proposed
          --output .wtt-ci/artifacts/pr-review
          --pull-request "$PR_NUMBER"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"

      - name: Verify trusted final review bundle
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/verify-pr-preview.mjs
          .wtt-ci/artifacts/pr-review/bundle

      - name: Bound final review artifact before upload
        run: >-
          node --experimental-strip-types .wtt-ci/trusted/scripts/prepare-pr-review-workspace.mjs sanitize-artifact
          --source .wtt-ci/artifacts/pr-review/bundle
          --output .wtt-ci/artifacts/pr-review-upload

      - name: Upload visual review artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-${{ needs.validate-handoff.outputs.pull_request_number }}-visual-review
          path: .wtt-ci/artifacts/pr-review-upload
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  report-review-status:
    name: Publish trusted contributor review status
    needs: [validate-handoff, build-hostile-canvas, visual-preview]
    if: ${{ always() && needs.validate-handoff.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted status reporter
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Report exact reviewed head result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-handoff.outputs.pull_request_number }}
          BASE_REPOSITORY: ${{ needs.validate-handoff.outputs.base_repository }}
          BASE_SHA: ${{ needs.validate-handoff.outputs.base_sha }}
          HEAD_REPOSITORY: ${{ needs.validate-handoff.outputs.head_repository }}
          HEAD_SHA: ${{ needs.validate-handoff.outputs.head_sha }}
          HANDOFF_RESULT: ${{ needs.validate-handoff.result }}
          BUILD_RESULT: ${{ needs.build-hostile-canvas.result }}
          PREVIEW_RESULT: ${{ needs.visual-preview.result }}
        run: node --experimental-strip-types scripts/report-review-status.mjs
